[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cablecalc"
version = "0.1.0"
description = "LV cable sizing to IEC or IS tables: current capacity, voltage drop, short-circuit withstand, with a Word calculation report."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Manas Mohanty"}]
dependencies = ["openpyxl>=3.1", "python-docx>=1.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cablecalc = "cablecalc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cablecalc = ["data/*/*.csv"]
